<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1b35">
  <title>Taller Municipal — Bahía Blanca</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Barlow', sans-serif; background: #f8fafd; min-height: 100vh; }
    #app { max-width: 100%; min-height: 100vh; display: flex; flex-direction: column; }

    /* ── PANTALLA INICIO ── */
    #pantalla-inicio {
      min-height: 100vh;
      background: #0b1b35;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      gap: 32px;
    }
    .inicio-header { text-align: center; }
    .inicio-logo {
      width: 72px; height: 72px;
      background: #fff;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px; font-weight: 800; color: #0b1b35;
      margin: 0 auto 16px;
    }
    .inicio-titulo {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px; font-weight: 800; color: #fff;
      letter-spacing: 1px;
    }
    .inicio-sub { font-size: 12px; color: rgba(255,255,255,.4); margin-top: 4px; letter-spacing: 2px; text-transform: uppercase; }
    .inicio-areas { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 340px; }
    .area-card {
      background: rgba(255,255,255,.06);
      border: 1.5px solid rgba(255,255,255,.12);
      border-radius: 18px;
      padding: 24px 20px;
      cursor: pointer;
      transition: all .2s;
      display: flex; align-items: center; gap: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .area-card:active { transform: scale(.97); }
    .area-card:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); }
    .area-card.sol { border-color: rgba(59,130,246,.4); }
    .area-card.sol:hover { background: rgba(59,130,246,.1); border-color: rgba(59,130,246,.6); }
    .area-card.dep { border-color: rgba(21,128,61,.4); }
    .area-card.dep:hover { background: rgba(21,128,61,.1); border-color: rgba(21,128,61,.6); }
    .area-card.lub { border-color: rgba(245,158,11,.4); }
    .area-card.lub:hover { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.6); }
    .area-ico {
      width: 52px; height: 52px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
    }
    .area-ico.sol { background: rgba(59,130,246,.2); }
    .area-ico.dep { background: rgba(21,128,61,.2); }
    .area-ico.lub { background: rgba(245,158,11,.2); }
    .area-info { flex: 1; }
    .area-nombre { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; color: #fff; }
    .area-desc { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 2px; }
    .area-arrow { color: rgba(255,255,255,.3); font-size: 20px; }

    /* ── APP (cuando área seleccionada) ── */
    #pantalla-app { display: none; flex-direction: column; min-height: 100vh; }
    #pantalla-app.visible { display: flex; }

    /* ── NAVBAR ── */
    .nav { background: #0b1b35; padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
    .nav-logo { width: 34px; height: 34px; background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 800; color: #0b1b35; flex-shrink: 0; cursor: pointer; }
    .nav-title { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; color: #fff; flex: 1; }
    .nav-sub { font-size: 10px; color: rgba(255,255,255,.5); display: block; }
    .nav-refresh { background: none; border: none; color: rgba(255,255,255,.7); cursor: pointer; padding: 6px; border-radius: 8px; }
    .nav-refresh:hover { background: rgba(255,255,255,.1); }
    .nav-refresh svg { width: 18px; height: 18px; }

    /* ── TABS (solo en Solicitudes) ── */
    .tabs { display: flex; background: #fff; border-bottom: 2px solid #e4eaf5; padding: 0 12px; gap: 4px; position: sticky; top: 62px; z-index: 40; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .tabs.oculto { display: none; }
    .tab { flex: 1; padding: 12px 8px; border: none; background: none; font-family: 'Barlow', sans-serif; font-size: 13px; font-weight: 700; color: #64748b; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .tab:hover { color: #0b1b35; }
    .tab.activo { color: #0b1b35; border-bottom-color: #0b1b35; }
    .tab .badge { background: #e4eaf5; color: #475569; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 20px; }
    .tab.activo .badge { background: #0b1b35; color: #fff; }
    .tab-bhi.activo { color: #1d4ed8; border-bottom-color: #1d4ed8; }
    .tab-bhi.activo .badge { background: #1d4ed8; }
    .tab-pib.activo { color: #15803d; border-bottom-color: #15803d; }
    .tab-pib.activo .badge { background: #15803d; }

    /* ── CONTENIDO ── */
    .content { flex: 1; padding: 14px; display: none; }
    .content.activo { display: block; }

    /* ── FILTROS ── */
    .filtros { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .filtro-search { flex: 1; min-width: 180px; padding: 9px 12px; border: 1.5px solid #e4eaf5; border-radius: 10px; font-family: 'Barlow', sans-serif; font-size: 13px; background: #fff; outline: none; }
    .filtro-search:focus { border-color: #93c5fd; }
    .filtro-sel { padding: 9px 10px; border: 1.5px solid #e4eaf5; border-radius: 10px; font-family: 'Barlow', sans-serif; font-size: 12px; background: #fff; outline: none; cursor: pointer; }

    /* ── TARJETAS ── */
    .cards { display: flex; flex-direction: column; gap: 10px; }
    .card { background: #fff; border-radius: 14px; padding: 14px 16px; border: 1.5px solid #e2e8f4; box-shadow: 0 1px 2px rgba(11,27,53,.06), 0 0 0 1px rgba(11,27,53,.03); cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; }
    .card:hover { border-color: #93c5fd; box-shadow: 0 4px 16px rgba(11,27,53,.12), 0 1px 3px rgba(11,27,53,.08); transform: translateY(-1px); }
    .card:active { transform: translateY(0); }
    .card.rechazado { border-color: #fca5a5; background: #fff8f8; }
    .card.rechazado:hover { border-color: #f87171; }
    .card.finalizado { border-color: #86efac; background: #f0fdf4; }
    .card.finalizado:hover { border-color: #4ade80; }
    .card.en-proceso { border-color: #93c5fd; }
    .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .card-id { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; flex: 1; }
    .card-id.bhi { color: #2563eb; }
    .card-id.pib { color: #16a34a; }
    .card-fecha { font-size: 10px; color: #94a8be; font-weight: 600; white-space: nowrap; }
    .card-estado { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; white-space: nowrap; letter-spacing: .2px; }
    .estado-pendiente   { background: #fef9c3; color: #92400e; }
    .estado-pase-firma  { background: #eff6ff; color: #2563eb; }
    .estado-iniciado    { background: #dcfce7; color: #15803d; }
    .estado-aprobado    { background: #bbf7d0; color: #166534; }
    .estado-fisico      { background: #ffedd5; color: #c2410c; }
    .estado-rechazado   { background: #fecaca; color: #dc2626; }
    .card-oficina { font-size: 11px; font-weight: 700; color: #5a7194; margin-bottom: 3px; text-transform: uppercase; letter-spacing: .3px; }
    .card-ri-grande { font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:800; color:#0f1f3d; margin: 2px 0 4px; }
    .card-detalle { font-size: 12px; color: #5a7194; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; }
    .card-footer { display: flex; gap: 6px; flex-wrap: wrap; }
    .card-chip { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 6px; background: #f1f5f9; color: #5a7194; }
    .card-edit-inp { border:1.5px solid #e2e8f4; border-radius:8px; padding:7px 10px; font-family:'Barlow',sans-serif; font-size:12px; font-weight:600; color:#0f1f3d; outline:none; background:#f8fafd; transition:border-color .15s; }
    .card-edit-inp:focus { border-color:#3b82f6; background:#fff; }
    .card-edit-inp.guardado { border-color:#16a34a; background:#f0fdf4; }
    .card-chip.ok { background: #dcfce7; color: #15803d; }
    .card-chip-link { text-decoration: none; cursor: pointer; transition: background .12s; }
    .card-chip-link:hover { background: #bbf7d0; }
    .card-chip.warn { background: #fef9c3; color: #92400e; }
    .card-chip.oc { background: #ede9fe; color: #7c3aed; }

    /* ── MODAL DETALLE ── */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; display: none; align-items: flex-end; justify-content: center; }
    .modal-bg.open { display: flex; }
    .modal { background: #fff; border-radius: 20px 20px 0 0; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; padding: 0 0 32px; }
    .modal-drag { width: 40px; height: 4px; background: #e4eaf5; border-radius: 2px; margin: 12px auto 16px; }
    .modal-hdr { padding: 0 20px 16px; border-bottom: 1px solid #f0f4f9; }
    .modal-id { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; }
    .modal-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
    .modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-field { }
    .modal-label { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
    .modal-val { font-size: 13px; font-weight: 600; color: #0f172a; }
    .modal-detalle-full { grid-column: 1/-1; }
    .modal-acciones { padding: 0 20px; display: flex; flex-direction: column; gap: 8px; }
    .modal-acciones-title { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
    .btn-accion { width: 100%; padding: 12px; border: none; border-radius: 12px; font-family: 'Barlow', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; transition: opacity .15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-accion svg { width: 16px; height: 16px; }
    .btn-aprobar   { background: #0b1b35; color: #fff; }
    .btn-firma     { background: #dbeafe; color: #1d4ed8; }
    .btn-iniciado  { background: #dcfce7; color: #15803d; }
    .btn-aprobado  { background: #bbf7d0; color: #166534; }
    .btn-fisico    { background: #fed7aa; color: #c2410c; }
    .btn-rechazar  { background: #fecaca; color: #dc2626; }
    .btn-accion:disabled { opacity: .4; cursor: not-allowed; }

    /* ── EMPTY / SPINNER ── */
    .empty { text-align: center; padding: 60px 20px; color: #94a3b8; font-size: 14px; }
    .empty svg { width: 48px; height: 48px; margin: 0 auto 12px; display: block; opacity: .3; }
    .spinner { text-align: center; padding: 60px 20px; color: #94a3b8; font-size: 13px; }

    /* ── GRUPOS SOLICITUDES ── */
    .grp-estado { margin-bottom:18px; }
    .grp-estado-lbl { font-family:'Barlow Condensed',sans-serif; font-size:17px; font-weight:800; color:#0b1b35; padding:8px 0 6px; border-bottom:2px solid #0b1b35; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
    .grp-count { font-size:11px; font-weight:700; background:#0b1b35; color:#fff; padding:2px 8px; border-radius:20px; }
    .grp-mes { margin-bottom:12px; }
    .grp-mes-lbl { font-size:12px; font-weight:700; color:#64748b; margin-bottom:8px; padding:4px 10px; background:#f1f5f9; border-radius:8px; display:inline-block; }
    .grp-sec { padding-left:10px; border-left:3px solid #e4eaf5; margin-bottom:10px; }
    .grp-sec-lbl { font-size:11px; font-weight:700; color:#475569; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
    .grp-ri { margin-bottom:8px; }
    .grp-ri-lbl { font-size:10px; font-weight:800; color:#fff; background:#64748b; display:inline-block; padding:2px 10px; border-radius:20px; margin-bottom:5px; }

    /* ── BOTTOM NAV ── */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e4eaf5; display: flex; padding: 8px 0 env(safe-area-inset-bottom); box-shadow: 0 -2px 10px rgba(0,0,0,.06); z-index: 50; }
    .bottom-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; border: none; background: none; cursor: pointer; color: #94a3b8; font-family: 'Barlow', sans-serif; font-size: 10px; font-weight: 700; transition: color .15s; }
    .bottom-btn.activo { color: #0b1b35; }
    .bottom-btn svg { width: 22px; height: 22px; }

    /* ── FLOTA IFRAME ── */
    #panel-flota { padding: 0; }
    #panel-flota iframe { width: 100%; height: calc(100vh - 62px - 70px); border: none; display: block; }

    @media (min-width: 768px) {
      #panel-flota.activo {
        background: #e8edf5;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 24px;
        min-height: calc(100vh - 62px - 70px);
      }
      #panel-flota.activo iframe {
        width: 420px;
        height: min(820px, calc(100vh - 62px - 70px - 48px));
        border-radius: 24px;
        box-shadow: 0 12px 40px rgba(11,27,53,.25);
      }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (min-width: 600px) {
      .content { max-width: 700px; margin: 0 auto; }
      .inicio-areas { max-width: 400px; }
    }
  </style>
  <style>
    @media print {
      body > *:not(#print-area) { display:none !important; }
      #print-area { display:block !important; }
      .no-print { display:none !important; }
      body { background: white !important; }
    }
  </style>
</head>
<body>

<!-- ══ PANTALLA DE INICIO ══ -->
<div id="pantalla-inicio">
  <div class="inicio-header">
    <div class="inicio-logo">MU</div>
    <div class="inicio-titulo">Taller Municipal</div>
    <div class="inicio-sub">Bahía Blanca</div>
  </div>

  <div class="inicio-areas">
    <div class="area-card sol" onclick="entrarArea('solicitudes')">
      <div class="area-ico sol">📋</div>
      <div class="area-info">
        <div class="area-nombre">Solicitudes</div>
        <div class="area-desc">BHI · PIB · Flota</div>
      </div>
      <span class="area-arrow">›</span>
    </div>

    <div class="area-card dep" onclick="entrarArea('deposito')">
      <div class="area-ico dep">📦</div>
      <div class="area-info">
        <div class="area-nombre">Depósito</div>
        <div class="area-desc">PIB · Flota</div>
      </div>
      <span class="area-arrow">›</span>
    </div>

    <div class="area-card lub" onclick="entrarArea('lubricentro')">
      <div class="area-ico lub">🛢️</div>
      <div class="area-info">
        <div class="area-nombre">Lubricentro</div>
        <div class="area-desc">Aceites · Service</div>
      </div>
      <span class="area-arrow">›</span>
    </div>
  </div>
</div>

<!-- ══ PANTALLA APP ══ -->
<div id="pantalla-app">

  <nav class="nav">
    <div class="nav-logo" onclick="volverInicio()" title="Volver al inicio">MU</div>
    <div style="flex:1">
      <div class="nav-title" id="nav-titulo">Taller Municipal</div>
      <span class="nav-sub" id="nav-subtitulo"></span>
    </div>
    <button class="nav-refresh" id="btn-refresh" title="Actualizar">
      <i data-lucide="refresh-cw"></i>
    </button>
    <button class="nav-refresh" id="btn-basurero" title="Basurero" onclick="window.abrirBasurero && window.abrirBasurero()" style="color:#ef4444">
      <i data-lucide="trash-2"></i>
    </button>
  </nav>

  <!-- Tabs BHI/PIB (solo en área Solicitudes) -->
  <div class="tabs oculto" id="tabs-solicitudes">
    <button class="tab tab-bhi activo" id="tab-bhi">
      <i data-lucide="building-2" style="width:14px;height:14px"></i>
      BHI <span class="badge" id="badge-bhi">0</span>
    </button>
    <button class="tab tab-pib" id="tab-pib">
      <i data-lucide="wrench" style="width:14px;height:14px"></i>
      PIB <span class="badge" id="badge-pib">0</span>
    </button>
  </div>

  <!-- BHI -->
  <div class="content activo" id="panel-bhi">
    <div class="filtros">
      <input type="search" class="filtro-search" id="buscar-bhi" placeholder="🔍 Buscar por ID, RI, oficina...">
      <select class="filtro-sel" id="filtro-estado-bhi">
        <option value="">Todos los estados</option>
        <option value="Pendiente">Pendiente</option>
        <option value="Pase a Firma">Pase a Firma</option>
        <option value="Iniciado">Iniciado</option>
        <option value="aprobado">Aprobado</option>
        <option value="pase a fisico">Pase a Físico</option>
      </select>
      <select class="filtro-sel" id="orden-bhi">
        <option value="sector">Por sector</option>
        <option value="fecha">Por fecha</option>
        <option value="ri">Por RI</option>
      </select>
    </div>
    <div class="cards" id="cards-bhi">
      <div class="spinner">⏳ Cargando solicitudes BHI...</div>
    </div>
  </div>

  <!-- PIB -->
  <div class="content" id="panel-pib">
    <div class="filtros">
      <input type="search" class="filtro-search" id="buscar-pib" placeholder="🔍 Buscar por ID, RI, sección...">
      <select class="filtro-sel" id="filtro-estado-pib">
        <option value="">Todos los estados</option>
        <option value="Pendiente">Pendiente</option>
        <option value="Iniciado">Iniciado</option>
        <option value="aprobado">Aprobado</option>
        <option value="pase a fisico">Pase a Físico</option>
      </select>
      <select class="filtro-sel" id="orden-pib">
        <option value="estado">Por estado</option>
        <option value="fecha">Por fecha</option>
        <option value="ri">Por RI</option>
        <option value="sector">Por sector</option>
      </select>
    </div>
    <div class="cards" id="cards-pib">
      <div class="spinner">⏳ Cargando solicitudes PIB...</div>
    </div>
  </div>

  <!-- DEPÓSITO -->
  <div class="content" id="panel-deposito"></div>

  <!-- FLOTA -->
  <div class="content" id="panel-flota"></div>

  <!-- TALLERES (OT + Vales) -->
  <div class="content" id="panel-talleres"></div>

  <!-- LUBRICENTRO -->
  <div class="content" id="panel-lubricentro"></div>

  <div style="height:70px"></div>

  <!-- Bottom nav área Solicitudes -->
  <nav class="bottom-nav" id="nav-sol" style="display:none">
    <button class="bottom-btn activo" id="nav-sol-solicitudes">
      <i data-lucide="clipboard-list"></i>
      Solicitudes
    </button>
    <button class="bottom-btn" id="nav-sol-flota">
      <i data-lucide="car"></i>
      Flota
    </button>
    <button class="bottom-btn" id="nav-sol-talleres">
      <i data-lucide="wrench"></i>
      Talleres
    </button>
  </nav>

  <!-- Bottom nav área Depósito (admin) -->
  <nav class="bottom-nav" id="nav-dep" style="display:none">
    <button class="bottom-btn activo" id="nav-dep-deposito">
      <i data-lucide="package"></i>
      Depósito
    </button>
    <button class="bottom-btn" id="nav-dep-flota">
      <i data-lucide="car"></i>
      Flota
    </button>
    <button class="bottom-btn" id="nav-dep-talleres">
      <i data-lucide="wrench"></i>
      Talleres
    </button>
  </nav>

  <!-- Bottom nav rol Depósito (usuario depósito: Depósito + Flota + Lubricentro + Talleres) -->
  <nav class="bottom-nav" id="nav-rol-dep" style="display:none">
    <button class="bottom-btn activo" id="nav-rd-deposito">
      <i data-lucide="package"></i>
      Depósito
    </button>
    <button class="bottom-btn" id="nav-rd-flota">
      <i data-lucide="car"></i>
      Flota
    </button>
    <button class="bottom-btn" id="nav-rd-lubricentro">
      <i data-lucide="droplets"></i>
      Lubricentro
    </button>
    <button class="bottom-btn" id="nav-rd-talleres">
      <i data-lucide="wrench"></i>
      Talleres
    </button>
  </nav>

</div>

<!-- Modal detalle -->
<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal">
    <div class="modal-drag"></div>
    <div class="modal-hdr">
      <div class="modal-id" id="modal-id">—</div>
      <div style="font-size:11px;color:#94a3b8;margin-top:2px" id="modal-fecha">—</div>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-acciones" id="modal-acciones"></div>
  </div>
</div>

<script type="module" src="views/solicitudes.js"></script>
<script type="module">
  import { montarDeposito }    from './views/deposito.js';
  import { montarTalleres }    from './views/talleres.js';
  import { montarLubricentro } from './views/lubricentro.js';

  let depositoCargado    = false;
  let flotaSolCargada    = false;
  let talleresCargado    = false;
  let flotaDepCargada    = false;
  let flotaRdCargada     = false;
  let lubricentroCargado = false;

  const ROL = new URLSearchParams(location.search).get('rol') || sessionStorage.getItem('rol');
  if (ROL) sessionStorage.setItem('rol', ROL);

  function ocultarNavs() {
    ['nav-sol','nav-dep','nav-rol-dep'].forEach(id => {
      document.getElementById(id).style.display = 'none';
    });
    document.getElementById('tabs-solicitudes').classList.add('oculto');
  }

  function activarPanel(panelId) {
    document.querySelectorAll('.content').forEach(p => p.classList.remove('activo'));
    document.getElementById(panelId).classList.add('activo');
    if (window.lucide) lucide.createIcons();
  }

  function activarBtnSol(btnId) {
    document.querySelectorAll('#nav-sol .bottom-btn').forEach(b => b.classList.remove('activo'));
    document.getElementById(btnId).classList.add('activo');
  }

  function activarBtnDep(btnId) {
    document.querySelectorAll('#nav-dep .bottom-btn').forEach(b => b.classList.remove('activo'));
    document.getElementById(btnId).classList.add('activo');
  }

  function activarBtnRd(btnId) {
    document.querySelectorAll('#nav-rol-dep .bottom-btn').forEach(b => b.classList.remove('activo'));
    document.getElementById(btnId).classList.add('activo');
  }

  // ── Navegar dentro del rol depósito (sin pantalla de inicio, nav propio) ──
  function irSeccionRd(seccion) {
    sessionStorage.setItem('seccion-rd', seccion);
    ocultarNavs();
    document.getElementById('btn-basurero').style.display = 'none';
    document.getElementById('nav-rol-dep').style.display = 'flex';

    if (seccion === 'deposito') {
      document.getElementById('nav-titulo').textContent = 'Depósito';
      document.getElementById('nav-subtitulo').textContent = 'PIB · Flota';
      activarPanel('panel-deposito');
      activarBtnRd('nav-rd-deposito');
      if (!depositoCargado) { depositoCargado = true; montarDeposito(document.getElementById('panel-deposito')); }
    } else if (seccion === 'flota') {
      document.getElementById('nav-titulo').textContent = 'Flota';
      document.getElementById('nav-subtitulo').textContent = 'Vehículos municipales';
      activarPanel('panel-flota');
      activarBtnRd('nav-rd-flota');
      if (!flotaRdCargada) {
        flotaRdCargada = true;
        document.getElementById('panel-flota').innerHTML =
          '<iframe src="https://marcelofurlong3.github.io/flota-municipal/" allowfullscreen></iframe>';
      }
    } else if (seccion === 'lubricentro') {
      document.getElementById('nav-titulo').textContent = 'Lubricentro';
      document.getElementById('nav-subtitulo').textContent = 'Aceites · Service';
      activarPanel('panel-lubricentro');
      activarBtnRd('nav-rd-lubricentro');
      if (!lubricentroCargado) { lubricentroCargado = true; montarLubricentro(document.getElementById('panel-lubricentro')); }
    } else if (seccion === 'talleres') {
      document.getElementById('nav-titulo').textContent = 'Talleres';
      document.getElementById('nav-subtitulo').textContent = 'OT · Vales';
      activarPanel('panel-talleres');
      activarBtnRd('nav-rd-talleres');
      if (!talleresCargado) { talleresCargado = true; montarTalleres(document.getElementById('panel-talleres')); }
    }
    if (window.lucide) lucide.createIcons();
  }

  window.entrarArea = function(area) {
    sessionStorage.setItem('area', area);
    document.getElementById('pantalla-inicio').style.display = 'none';
    document.getElementById('pantalla-app').classList.add('visible');

    ocultarNavs();
    document.getElementById('btn-basurero').style.display = '';

    if (area === 'solicitudes') {
      document.getElementById('nav-titulo').textContent = 'Solicitudes';
      document.getElementById('nav-subtitulo').textContent = 'BHI · PIB · Flota';
      document.getElementById('tabs-solicitudes').classList.remove('oculto');
      document.getElementById('nav-sol').style.display = 'flex';
      activarPanel('panel-bhi');
      activarBtnSol('nav-sol-solicitudes');
    } else if (area === 'lubricentro') {
      document.getElementById('nav-titulo').textContent = 'Lubricentro';
      document.getElementById('nav-subtitulo').textContent = 'Aceites · Service';
      document.getElementById('btn-basurero').style.display = 'none';
      activarPanel('panel-lubricentro');
      if (!lubricentroCargado) { lubricentroCargado = true; montarLubricentro(document.getElementById('panel-lubricentro')); }
    } else {
      document.getElementById('nav-titulo').textContent = 'Depósito';
      document.getElementById('nav-subtitulo').textContent = 'PIB · Flota';
      document.getElementById('nav-dep').style.display = 'flex';
      activarPanel('panel-deposito');
      activarBtnDep('nav-dep-deposito');
      if (!depositoCargado) { depositoCargado = true; montarDeposito(document.getElementById('panel-deposito')); }
    }
    if (window.lucide) lucide.createIcons();
  };

  window.volverInicio = function() {
    // Rol depósito: el logo MU no hace nada (ya están en su área)
    if (ROL === 'deposito') return;
    sessionStorage.removeItem('area');
    document.getElementById('pantalla-inicio').style.display = 'flex';
    document.getElementById('pantalla-app').classList.remove('visible');
  };

  document.addEventListener('DOMContentLoaded', () => {

    // ── Nav rol Depósito ──
    document.getElementById('nav-rd-deposito').addEventListener('click',    () => irSeccionRd('deposito'));
    document.getElementById('nav-rd-flota').addEventListener('click',       () => irSeccionRd('flota'));
    document.getElementById('nav-rd-lubricentro').addEventListener('click', () => irSeccionRd('lubricentro'));
    document.getElementById('nav-rd-talleres').addEventListener('click',    () => irSeccionRd('talleres'));

    // ── Nav Solicitudes ──
    document.getElementById('nav-sol-solicitudes').addEventListener('click', () => {
      activarPanel('panel-bhi');
      activarBtnSol('nav-sol-solicitudes');
      document.getElementById('tabs-solicitudes').classList.remove('oculto');
    });
    document.getElementById('nav-sol-flota').addEventListener('click', () => {
      activarPanel('panel-flota');
      activarBtnSol('nav-sol-flota');
      document.getElementById('tabs-solicitudes').classList.add('oculto');
      if (!flotaSolCargada) {
        flotaSolCargada = true;
        document.getElementById('panel-flota').innerHTML =
          '<iframe src="https://marcelofurlong3.github.io/flota-municipal/" allowfullscreen></iframe>';
      }
    });
    document.getElementById('nav-sol-talleres').addEventListener('click', () => {
      activarPanel('panel-talleres');
      activarBtnSol('nav-sol-talleres');
      document.getElementById('tabs-solicitudes').classList.add('oculto');
      if (!talleresCargado) { talleresCargado = true; montarTalleres(document.getElementById('panel-talleres')); }
    });

    // ── Nav Depósito (admin) ──
    document.getElementById('nav-dep-talleres')?.addEventListener('click', () => {
      activarPanel('panel-talleres');
      activarBtnDep('nav-dep-talleres');
      if (!talleresCargado) { talleresCargado = true; montarTalleres(document.getElementById('panel-talleres')); }
    });
    document.getElementById('nav-dep-deposito').addEventListener('click', () => {
      activarPanel('panel-deposito');
      activarBtnDep('nav-dep-deposito');
      if (!depositoCargado) { depositoCargado = true; montarDeposito(document.getElementById('panel-deposito')); }
    });
    document.getElementById('nav-dep-flota').addEventListener('click', () => {
      activarPanel('panel-flota');
      activarBtnDep('nav-dep-flota');
      if (!flotaDepCargada) {
        flotaDepCargada = true;
        document.getElementById('panel-flota').innerHTML =
          '<iframe src="https://marcelofurlong3.github.io/flota-municipal/" allowfullscreen></iframe>';
      }
    });

    // ── Arranque según rol ──
    if (ROL === 'deposito') {
      // Ocultar card Solicitudes en pantalla de inicio
      document.querySelector('.area-card.sol').style.display = 'none';
      // Entrar directo sin pasar por la pantalla de inicio
      document.getElementById('pantalla-inicio').style.display = 'none';
      document.getElementById('pantalla-app').classList.add('visible');
      // Restaurar sección previa o ir a Depósito por defecto
      const seccion = sessionStorage.getItem('seccion-rd') || 'deposito';
      irSeccionRd(seccion);
    } else {
      const area = sessionStorage.getItem('area');
      if (area) entrarArea(area);
    }
  });
</script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
<!-- Área de impresión: hijo directo de body para que el CSS @media print funcione -->
<div id="print-area" style="display:none"></div>
</body>
</html>
